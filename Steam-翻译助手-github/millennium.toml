[plugin]
id = "steamtranslator"
name = "Steam 翻译助手"
version = "1.1.0"
author = "garaf"
description = "右键翻译 Steam 页面或选区，支持输入框翻译、双语对照、术语表和本地译文缓存；兼容 DeepSeek 等翻译接口。"

[assets]
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]


[frontend]
entry = "frontend/library.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "Steam-翻译助手.star"

[logger]
padding = 0
backend_prefix  = "BCK"
frontend_prefix = "FRT"
webview_prefix  = "WEB"

name: Check and release Steam Translator

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: Steam-翻译助手-github
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Check release tag against manifest
        if: github.ref_type == 'tag'
        run: |
          bun -e 'const manifest = Bun.TOML.parse(await Bun.file("millennium.toml").text()); if (`v${manifest.plugin.version}` !== process.env.GITHUB_REF_NAME) throw Error("Tag must match millennium.toml");'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run inspect
      - name: Verify the committed package matches a clean build
        run: git diff --exit-code -- 'Steam-翻译助手.star'

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish the installable package and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset_dir="$RUNNER_TEMP/steamtranslator-release"
          mkdir -p "$asset_dir"
          cp 'Steam-翻译助手-github/Steam-翻译助手.star' "$asset_dir/steamtranslator.star"
          (cd "$asset_dir" && sha256sum steamtranslator.star > SHA256SUMS.txt)
          awk -v title="## $version" '$0 == title { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$asset_dir/notes.md"
          test -s "$asset_dir/notes.md"
          gh release create "$GITHUB_REF_NAME" "$asset_dir/steamtranslator.star" "$asset_dir/SHA256SUMS.txt" --verify-tag --title "Steam 翻译助手 $GITHUB_REF_NAME" --notes-file "$asset_dir/notes.md"
